# Databricks Asset Bundle: define o job como código. Ainda não implantado (depende de um workspace).
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run medalhao -t dev
bundle:
  name: smart-meter-lakehouse

variables:
  lake_raiz:
    description: Pasta do lakehouse em um Volume do Unity Catalog
    default: /Volumes/main/energia/lakehouse

resources:
  jobs:
    medalhao:
      name: medalhao-medidores
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/pipeline.py
            base_parameters: {camada: bronze, lake_raiz: "${var.lake_raiz}"}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/pipeline.py
            base_parameters: {camada: silver, lake_raiz: "${var.lake_raiz}"}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/pipeline.py
            base_parameters: {camada: gold, lake_raiz: "${var.lake_raiz}"}
        - task_key: manutencao
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ./notebooks/pipeline.py
            base_parameters: {camada: manutencao, lake_raiz: "${var.lake_raiz}"}

targets:
  dev:
    mode: development
    default: true
